<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        Log in | PostIt
    </title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <nav aria-label="Main navigation">
            <a href="index.html">
                Home
            </a>
            <a href="addPost.html">
                Add Post
            </a>
        </nav>
        <div class="profile-menu">
            <button class="profile-toggle" type="button" aria-label="Open profile menu" aria-expanded="false" aria-controls="profile-dropdown">
                <img src="assets/profile.svg" alt="" width="40" height="40">
            </button>
            <div class="profile-dropdown" id="profile-dropdown" hidden>
                <p class="profile-name">Reimo Zukker</p>
                <p class="profile-email">reimoz@example.com</p>
                <a href="login.html">Log out</a>
            </div>
        </div>
    </header>
    <main class="form-layout">
        <section class="form-card login-card">
            <h1>
                Welcome to PostIt
            </h1>
            <a href="#account-note">
                Create an account
            </a>
            <p>or<br><br>Please log in</p>
            <!-- This is a static demonstration, not real authentication. No name attributes means no credentials are included in the URL. -->
            <form action="index.html" method="get">
                <label class="visually-hidden" for="email">
                    Email
                </label>
                <input id="email" type="email" placeholder="Email" autocomplete="email" required>
                <label class="visually-hidden" for="password">
                    Password
                </label>
                <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">
                    Login
                </button>
            </form>
            <a href="#password-note">
                Forgot password
            </a>
            <p id="account-note" class="form-note">
                Account creation is outside this static demo.
            </p>
            <p id="password-note" class="form-note">
                Password recovery is outside this static demo.
            </p>
        </section>
    </main>
    <footer class="site-footer">
        PostIt · WAD Homework 2
    </footer>
    <script src="script.js"></script>
</body>

</html>
